<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glosář · TZI Trenér</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
/* barvy stejné jako v novy.html */
:root {
  --paper: #EEF2F6; --paper-2: #E2E8F0; --ink: #13203A; --muted: #55627A; --line: #C5CEDB; --blue: #2538D8;
  --font: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #0F1729; --paper-2: #1A2540; --ink: #E8EDF5; --muted: #9AA7BF; --line: #2C3957; --blue: #6F7DFF; }
}
body { background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--font); min-height: 100vh; }
main { max-width: 760px; margin: 0 auto; padding: 32px 20px 96px; }
a { color: var(--blue); }
.back { font-size: .9375rem; }
h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; margin: 20px 0 6px; }
.sub { color: var(--muted); margin-bottom: 8px; }
h2 { font-size: 1.25rem; font-weight: 800; margin: 40px 0 4px; padding-top: 16px; border-top: 3px solid var(--ink); }
.entry { padding: 14px 0; border-top: 1px solid var(--line); }
.entry h3 { font-size: 1.05rem; font-weight: 700; margin: 0 0 6px; }
.entry p, .entry ul { margin: 0 0 6px; line-height: 1.55; }
.entry ul { padding-left: 1.2em; }
.entry table { border-collapse: collapse; margin: 6px 0; font-size: .9375rem; }
.entry td, .entry th { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
.entry .src { color: var(--muted); font-size: .875rem; }
.entry code { font-family: var(--mono); font-size: .9em; }
sub, sup { font-size: .72em; line-height: 0; }
.frac, .binom > span { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.3; }
.frac { margin: 0 .1em; }
.frac > span { padding: 0 .25em; white-space: nowrap; }
.frac > span + span { border-top: 1.5px solid currentColor; }
.binom { display: inline-flex; align-items: center; vertical-align: middle; white-space: nowrap; }
.binom::before, .binom::after { font-size: 1.9em; font-weight: 300; line-height: 1; }
.binom::before { content: "("; } .binom::after { content: ")"; }
.empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <a class="back" href="/">← TZI Trenér</a>
  <h1>Glosář</h1>
  <p class="sub" id="sub"></p>
  <div id="out"></div>
</main>
<script src="/fmt.js"></script>
<script>
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const gInline = t => fmt(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>').replace(/`(.+?)`/g, '<code>$1</code>');

// pojmy jsou jednoduchý markdown: odstavce, odrážky, tabulky; citace (> ...) ztratí předponu, popisek „[!warning] Název“ je tučně
function gBody(body) {
  const out = [], L = body.split('\n').map(l => l.replace(/^>\s?(\[![a-z]+\]\s*(.*))?/, (m, c, t) => c ? (t ? `**${t}**` : '') : ''));
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    if (/^\|/.test(l)) {
      const rows = [];
      for (; i < L.length && /^\|/.test(L[i]); i++) if (!/^\|[\s|:-]+$/.test(L[i])) rows.push(L[i].replace(/^\||\|$/g, '').split('|'));
      i--;
      out.push('<table>' + rows.map((r, k) => '<tr>' + r.map(c => `<${k ? 'td' : 'th'}>${gInline(c.trim())}</${k ? 'td' : 'th'}>`).join('') + '</tr>').join('') + '</table>');
    } else if (/^- /.test(l)) {
      const items = [];
      for (; i < L.length && /^- /.test(L[i]); i++) items.push(L[i].slice(2));
      i--;
      out.push('<ul>' + items.map(x => `<li>${gInline(x)}</li>`).join('') + '</ul>');
    } else if (l.trim()) {
      out.push(`<p${/^\*Zdroj/.test(l) ? ' class="src"' : ''}>${gInline(l)}</p>`);
    }
  }
  return out.join('');
}

(async () => {
  const source = new URLSearchParams(location.search).get('source') || '';
  const r = await fetch('/api/glosar?source=' + encodeURIComponent(source));
  if (!r.ok) { $out('<p class="empty">Glosář se nepodařilo načíst.</p>'); return; }
  const d = await r.json();
  document.getElementById('sub').textContent = d.title;
  document.title = `Glosář: ${d.title} · TZI Trenér`;
  const multi = d.groups.length > 1; // u „všech přednášek“ je každý balíček pod vlastním nadpisem
  $out(d.groups.length ? d.groups.map(g =>
    (multi ? `<h2>${esc(g.label)}</h2>` : '') +
    g.entries.map(e => `<div class="entry"><h3>${gInline(e.term)}</h3>${gBody(e.body)}</div>`).join('')
  ).join('') : '<p class="empty">K téhle přednášce zatím nejsou v glosáři žádné pojmy.</p>');
  function $out(html) { document.getElementById('out').innerHTML = html; }
})();
</script>
</body>
</html>
